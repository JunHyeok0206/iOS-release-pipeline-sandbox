# Deploy 의 의존성 캐시(deploy.yml 의 Restore/Save 와 같은 키)를 미리 만들고 살려 둔다.
#
# 캐시는 "만든 브랜치 + 기본 브랜치" 에서만 보이므로 Deploy 가 도는 release 브랜치 범위에 만들어야 한다.
# develop push(잠금 파일 변경) 와 cron 은 release 가 아닌 ref 에서 뜨므로, relay job 이 자기 자신을 --ref release 로 dispatch 하고
# release ref 로 뜬 run 이 실제 작업을 한다.
#   warm      : develop 의 잠금 파일 커밋을 체크아웃해 설치 → 새 키로 저장 (macos). 다음 사이클 첫 Deploy 가 바로 히트
#   keepalive : 최신 캐시를 복원만 해서 "7일 미접근 삭제" 를 피한다 (ubuntu, 1~2분)
# 이 파일은 기본 브랜치(dispatch 등록)와 release(실행 ref)에 모두 있어야 한다. 첫 사이클을 거치면 충족된다.
name: Cache Warm
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Cache Warm {0} @{1}', inputs.mode, inputs.sha)
      || format('Cache Warm relay: {0}', github.event_name) }}

on:
  push:
    branches: [develop]
    paths:   # Deploy 의 캐시 키 재료와 같게 유지한다
      - Tuist/Package.resolved
      - Tuist/Package.swift
      - Podfile.lock
      - .mise.toml
      - .xcode-version
  schedule:
    - cron: '0 18 * * 0,3'   # UTC 일·수 18:00 = KST 월·목 03:00. 간격 3~4일 (7일 미접근 삭제보다 짧게)
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [warm, keepalive]
        default: warm
      sha:
        description: '체크아웃할 커밋 (warm). develop 에 머지된 커밋이어야 한다. 비우면 relay 가 develop HEAD 를, release 직접 실행은 release HEAD 를 쓴다'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cache-warm-${{ github.ref }}-${{ inputs.mode || 'relay' }}   # keepalive 가 대기 중인 warm 을 밀어내지 않도록 mode 별로
  cancel-in-progress: false

jobs:
  # release 가 아닌 ref(develop push, main 의 cron)에서 뜬 run: release ref 로 다시 띄운다
  relay:
    if: github.ref != 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # self-dispatch
    env:
      GH_TOKEN: ${{ github.token }}
      # cron → keepalive, develop push → warm, 수동 dispatch → 입력값 그대로
      MODE: ${{ github.event_name == 'schedule' && 'keepalive' || (inputs.mode || 'warm') }}
      # develop push 는 그 커밋. 수동 실행에서 sha 를 비우면 develop HEAD 로 채운다 (master 의 github.sha 는 develop 조상이 아니라 warm 검사에 걸린다)
      SHA: ${{ inputs.sha || (github.event_name == 'push' && github.sha) || '' }}
    steps:
      - run: |
          if [ "$MODE" = "warm" ]; then
            if [ -z "$SHA" ]; then
              SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)
              echo "sha 미지정 → develop HEAD $SHA"
            fi
            echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::sha 는 40자리 커밋 해시여야 합니다: $SHA"; exit 1; }
          fi
          echo "dispatch cache-warm.yml --ref release mode=$MODE sha=$SHA"
          gh workflow run cache-warm.yml -R "$GITHUB_REPOSITORY" --ref release -f mode="$MODE" -f sha="$SHA"

  keepalive:
    if: github.ref == 'refs/heads/release' && inputs.mode == 'keepalive'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 키 접두사만 주면 가장 최근 캐시를 복원한다. 복원 = 접근이라 수명이 연장된다. 러너 OS 가 달라도 tar 복원에는 문제 없다
      - uses: actions/cache/restore@v4
        with:
          path: Tuist/.build
          key: keepalive-spm-${{ github.run_id }}
          restore-keys: spm-macOS-
      - uses: actions/cache/restore@v4
        with:
          path: Pods
          key: keepalive-pods-${{ github.run_id }}
          restore-keys: pods-macOS-

  warm:
    if: github.ref == 'refs/heads/release' && inputs.mode == 'warm'
    runs-on: macos-26
    timeout-minutes: 150   # 설치 step 60분 ×2 + 여유
    env:
      SHA: ${{ inputs.sha || github.sha }}
    steps:
      # sha 를 지정했으면 origin/develop 의 조상(머지된 커밋)이어야 한다. 비우면 release HEAD 라 검사하지 않는다
      - name: Verify sha is on develop
        if: inputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::sha 는 40자리 커밋 해시여야 합니다: $SHA"; exit 1; }
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...develop" --jq .status)
          case "$STATUS" in
            ahead|identical) echo "$SHA 는 develop 에 포함된 커밋 ($STATUS)" ;;
            *) echo "::error::$SHA 는 develop 의 조상이 아닙니다 (compare status: $STATUS). develop 에 머지된 커밋만 warm 할 수 있습니다"; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}   # develop 의 잠금 파일 커밋. 캐시 범위는 run 의 ref(release)
          persist-credentials: false

      # Deploy 와 같은 Xcode 로 설치해야 SPM 캐시(툴체인 민감)가 호환된다. 버전의 단일 출처는 .xcode-version
      - id: xcode
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: jdx/mise-action@v5

      # 키는 deploy.yml 과 같아야 한다
      - name: Restore SPM cache
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: Tuist/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift', '.mise.toml', '.xcode-version') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Restore Pods cache
        id: pods-cache
        uses: actions/cache/restore@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      # SPM 의 바이너리 아티팩트 다운로드에는 타임아웃이 없어 일시적 네트워크 정지가 영구 hang 이 된다 (Timespread 6.0.5 첫 Deploy, 64분). 빨리 실패시키고 Re-run 한다
      - name: Tuist install / generate
        timeout-minutes: 60
        if: steps.spm-cache.outputs.cache-hit != 'true' || steps.pods-cache.outputs.cache-hit != 'true'
        run: |
          mise x -- tuist install
          mise x -- tuist generate --no-open

      - name: Pod install
        timeout-minutes: 60
        if: steps.pods-cache.outputs.cache-hit != 'true'
        run: bundle exec pod install

      - name: Save SPM cache
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Tuist/.build
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Save Pods cache
        if: steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Pods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      - name: Summary
        run: |
          {
            echo "### Cache Warm @${{ inputs.sha || github.sha }}"
            echo "- SPM: ${{ steps.spm-cache.outputs.cache-hit == 'true' && '이미 있음' || '저장' }} (\`${{ steps.spm-cache.outputs.cache-primary-key }}\`)"
            echo "- Pods: ${{ steps.pods-cache.outputs.cache-hit == 'true' && '이미 있음' || '저장' }} (\`${{ steps.pods-cache.outputs.cache-primary-key }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
