# release 브랜치 push 또는 workflow_dispatch 로 bump → firebase / test_flight 빌드
name: Deploy
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Deploy {0} {1}', inputs.lane, inputs.version)
      || format('Deploy push: {0}', github.event.head_commit.message) }}

on:
  push:
    branches: [release]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      lane:
        description: '배포 대상'
        type: choice
        options: [both, firebase, test_flight]
        default: both
      version:
        description: '마케팅 버전 x.y.z (비우면 release 의 현재 값 유지, 빌드 번호만 +1)'
        type: string
        required: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.reuse.outputs.sha || steps.push.outputs.sha }}
      version: ${{ steps.reuse.outputs.version || steps.push.outputs.version }}
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      - if: ${{ github.ref != 'refs/heads/release' }}
        run: |
          echo "::error::release 브랜치에서만 실행할 수 있습니다 (현재: ${{ github.ref }})"
          exit 1

      - name: Validate version input
        if: ${{ github.event.inputs.version != '' }}
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version 은 x.y.z 형식이어야 합니다 (입력: '$VERSION')"; exit 1; }

      # 이벤트 SHA 가 아니라 release 의 현재 tip 을 받는다. 재실행이나 연속 deploy 로 tip 이 앞서 있어도 push 가 non-fast-forward 로 거절되지 않도록
      - uses: actions/checkout@v5
        with:
          ref: release
          fetch-depth: 2
          persist-credentials: false

      # 재실행(Re-run all jobs)이면 이전 attempt 가 push 한 bump 를 그대로 쓴다: tip 이 "Bump version" 커밋이고 그 부모가 이 run 의 이벤트 SHA
      - name: Reuse bump from previous attempt
        id: reuse
        if: ${{ github.run_attempt > 1 }}
        run: |
          if [ "$(git rev-parse HEAD^)" = "${{ github.sha }}" ] && git log -1 --format=%s | grep -q '^Bump version to iOS'; then
            VERSION=$(sed -n 's/^MARKETING_VERSION *= *//p' Config/Version.xcconfig)
            BUILD=$(sed -n 's/^CURRENT_PROJECT_VERSION *= *//p' Config/Version.xcconfig)
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION ($BUILD)" >> "$GITHUB_OUTPUT"
            echo "이전 attempt 의 bump $(git rev-parse --short HEAD) 재사용 ($VERSION ($BUILD))"
          else
            echo "재사용할 bump 없음 → 새로 bump"
          fi

      - uses: ruby/setup-ruby@v1
        if: ${{ !steps.reuse.outputs.sha }}
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # 버전 결정 순서: dispatch 입력 → push 이벤트 커밋 메시지의 release-x.y.z → 없으면 현재 값 유지
      # 현재 값과 다르면 x.y.z (1) 로 시작, 같으면 빌드 번호 +1
      - name: Bump version and push
        id: push
        if: ${{ !steps.reuse.outputs.sha }}
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(printf '%s' "$HEAD_MSG" | head -1 | grep -oE 'release-[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's/^release-//' || true)
          fi
          CURRENT=$(sed -n 's/^MARKETING_VERSION *= *//p' Config/Version.xcconfig)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$VERSION" ] && [ "$VERSION" != "$CURRENT" ]; then
            bundle exec fastlane ios bump version:"$VERSION" build:1
          else
            bundle exec fastlane ios bump
          fi
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/${{ github.ref_name }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          NEW_VERSION=$(sed -n 's/^MARKETING_VERSION *= *//p' Config/Version.xcconfig)
          NEW_BUILD=$(sed -n 's/^CURRENT_PROJECT_VERSION *= *//p' Config/Version.xcconfig)
          echo "version=$NEW_VERSION ($NEW_BUILD)" >> "$GITHUB_OUTPUT"

      - name: Select lanes
        id: lanes
        run: |
          case "${{ github.event.inputs.lane }}" in
            firebase)    echo 'lanes=["firebase"]' ;;
            test_flight) echo 'lanes=["test_flight"]' ;;
            *)           echo 'lanes=["firebase","test_flight"]' ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          VERSION: ${{ steps.reuse.outputs.version || steps.push.outputs.version }}
          SHA: ${{ steps.reuse.outputs.sha || steps.push.outputs.sha }}
          REUSED: ${{ steps.reuse.outputs.sha != '' }}
        run: |
          {
            echo "## Deploy iOS $VERSION"
            echo
            echo "- lanes: $(echo '${{ steps.lanes.outputs.lanes }}' | tr -d '[]\"' | sed 's/,/, /g')"
            echo "- bump commit: [\`$(git rev-parse --short "$SHA")\`](${{ github.server_url }}/${{ github.repository }}/commit/$SHA)$([ "$REUSED" = true ] && echo ' (재실행: 이전 attempt 의 bump 재사용)' || true)"
            echo "- trigger: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.lane }} · ${{ needs.bump.outputs.version }}
    needs: bump
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.bump.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - run: xcodebuild -version

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: jdx/mise-action@v5

      # 의존성 캐시. 키 = 잠금 파일 해시. 히트하면 install 이 네트워크 없이 끝나 두 build job 의 중복 설치 시간이 사라진다.
      # restore-keys 로 가장 가까운 옛 캐시를 부분 복원하고, 정확히 맞는 키가 없을 때만 저장한다 (두 job 이 같은 키를 동시에 저장하면 뒤쪽은 경고만 나고 넘어감).
      # 삭제: 7일 미사용 또는 리포 합계 10GB 초과 시 GitHub 가 자동 삭제. 수동은 Settings → Actions → Caches
      - name: Restore SPM cache
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: Tuist/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved', '.mise.toml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Restore Pods cache
        id: pods-cache
        uses: actions/cache/restore@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Tuist install / generate
        run: |
          mise x -- tuist install
          mise x -- tuist generate --no-open

      - name: Pod install
        run: bundle exec pod install

      - name: Save SPM cache
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Tuist/.build
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Save Pods cache
        if: steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Pods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      - name: fastlane ios ${{ matrix.lane }}
        run: bundle exec fastlane ios "${{ matrix.lane }}"
