name: Release Note

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: Find release commit
        id: release
        run: |
          COMMIT=$(git log --max-count=20 --pretty=format:'%H %s' | awk '$2 == "release:" {print $1; exit}')
          if [ -z "$COMMIT" ]; then
            echo "has_release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          VERSION=$(git log -1 --pretty=%s "$COMMIT" | sed 's/^release: *v\{0,1\}//' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          echo "has_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            echo "배포일"
            echo "* $(TZ=Asia/Seoul date '+%Y/%m/%d')"
            echo
            echo "반영사항"
            git log -1 --pretty=%b "$COMMIT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - if: steps.release.outputs.has_release == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.release.outputs.version }}',
              name: '${{ steps.release.outputs.version }}',
              body: `${{ steps.release.outputs.notes }}`,
            });
